name: Dependabot security updates

# Weekly, supply-chain-aware security-update PR.
#
# Policy (see CLAUDE.md "Supply chain risk"):
#   - Go: no native minimum-release-age exists, so tools/depsec gates each fix on
#     the module's Go-proxy publish time and applies only those >= 7 days old.
#     Newer fixes are deferred to a later run (acceptable).
#   - npm: the age gate + Takumi Guard registry + exclusions are enforced natively
#     by web/.npmrc via pnpm (>= 10.16). We only run `pnpm update --latest` on the
#     direct packages Dependabot flagged; pnpm refuses versions younger than the
#     window. Transitive npm packages are never auto-overridden (manual review).
#
# The PR is opened with a GitHub App token (not GITHUB_TOKEN) for three reasons:
# reading Dependabot alerts needs the "Dependabot alerts: read" permission; a PR
# authored by an App token triggers the normal CI workflows that validate it (PRs
# authored by GITHUB_TOKEN do not); and the commit is created through the GitHub
# API (createCommitOnBranch), which GitHub signs — satisfying the repo's
# "verified signatures" ruleset without weakening it (a `git push` from the
# runner would be unsigned and rejected).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      min-age:
        description: "Minimum release age for Go fixes (Go duration, e.g. 168h)"
        required: false
        default: "168h"

permissions:
  contents: read

concurrency:
  group: dependabot-security
  cancel-in-progress: false

jobs:
  security-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment secrets (DEPSEC_APP_ID / DEPSEC_APP_PRIVATE_KEY) are only
    # readable by a job that declares the environment. Restrict the environment's
    # deployment branches to `main` so only the scheduled/main run can mint the
    # high-privilege App token. Do NOT add "required reviewers" unless you want to
    # manually approve every weekly run (it would pause the job).
    environment: dependabot-security
    steps:
      # Mint the App token first; every network step below (alert fetch, the
      # createCommitOnBranch commit, PR create/edit) authenticates as the App via
      # GH_TOKEN/GITHUB_TOKEN. The commit is made through the GitHub API, not a
      # `git push`, so it is server-signed and passes the verified-signatures rule.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPSEC_APP_ID }}
          private-key: ${{ secrets.DEPSEC_APP_PRIVATE_KEY }}
          # Needs permissions: Dependabot alerts (read), Contents (write),
          # Pull requests (write). Install the App on this repo only.

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10 # >= 10.16 so web/.npmrc `minimum-release-age` is honored

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Compute update plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MIN_AGE: ${{ github.event.inputs.min-age || '168h' }}
        run: |
          set -euo pipefail
          cd tools/depsec
          # Write plan/body OUTSIDE the working tree so they are never committed
          # to the PR branch.
          go run . \
            -owner "${GITHUB_REPOSITORY%/*}" \
            -repo "${GITHUB_REPOSITORY#*/}" \
            -package-json ../../web/package.json \
            -plan-out "$RUNNER_TEMP/plan.json" \
            -body-out "$RUNNER_TEMP/pr-body.md" \
            -min-age "$MIN_AGE"

      - name: Show plan
        run: cat "$RUNNER_TEMP/plan.json"

      - name: Apply Go module bumps
        run: |
          set -euo pipefail
          mapfile -t gomods < <(jq -r '(.go_accepted // [])[] | "\(.name)@\(.target_version)"' "$RUNNER_TEMP/plan.json")
          if [ ${#gomods[@]} -eq 0 ]; then
            echo "no eligible Go bumps"
          else
            for m in "${gomods[@]}"; do
              echo "go get $m"
              go get "$m"
            done
            go mod tidy
          fi

      - name: Apply npm direct-dependency updates
        run: |
          set -euo pipefail
          mapfile -t npmpkgs < <(jq -r '(.npm_update // [])[].name' "$RUNNER_TEMP/plan.json")
          if [ ${#npmpkgs[@]} -eq 0 ]; then
            echo "no npm direct updates"
          else
            echo "pnpm update --latest ${npmpkgs[*]}"
            # web/.npmrc enforces registry + minimum-release-age + exclusions.
            pnpm --dir web update --latest "${npmpkgs[@]}"
          fi

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to apply (all fixes deferred or none eligible)."
            exit 0
          fi

          branch="automated/security-updates"
          base_sha="$(git rev-parse HEAD)"

          # The repo requires verified (signed) commits. A commit made in the
          # runner via `git commit`/`git push` is unsigned and gets rejected by
          # the ruleset. Instead, create the commit through the GitHub API
          # (GraphQL createCommitOnBranch) — GitHub signs API-authored commits,
          # so they satisfy the signature rule while keeping it enforced.

          # Reset the branch ref to the current base so expectedHeadOid is known.
          # (git diff below is relative to that same base, so the API commit
          # contains exactly this run's dependency-manifest changes.)
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
                 -f sha="$base_sha" -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base_sha" >/dev/null
          fi

          # Changed files vs base. plan.json / pr-body.md live in $RUNNER_TEMP,
          # so only the dependency manifests (go.mod, go.sum, web/package.json,
          # lockfile) appear here.
          adds="$(git diff --name-only --diff-filter=d HEAD | while read -r f; do
            jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" '{path:$p, contents:$c}'
          done | jq -s '.')"
          dels="$(git diff --name-only --diff-filter=D HEAD | jq -R 'select(length>0)|{path:.}' | jq -s '.')"

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg sha "$base_sha" \
            --arg msg "fix(deps): weekly Dependabot security updates (>=7d release age)" \
            --argjson adds "$adds" \
            --argjson dels "$dels" \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{url}}}",
              variables:{input:{
                branch:{repositoryNameWithOwner:$repo, branchName:$branch},
                message:{headline:$msg},
                expectedHeadOid:$sha,
                fileChanges:{additions:$adds, deletions:$dels}}}}' \
            > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" >/dev/null

          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -qx 0; then
            gh pr create --base main --head "$branch" \
              --title "fix(deps): weekly Dependabot security updates" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          else
            echo "PR already open for $branch; branch updated in place."
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md" || true
          fi
