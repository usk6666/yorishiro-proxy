name: Nightly e2e (full)

# Runs the full e2e test suite (`-tags e2e`, includes both smoke and exhaustive
# tests) on a nightly cadence. The per-PR gate runs only the smoke subset via
# `ci.yml`'s `test-e2e-smoke` job — see USK-728 for the tier split rationale.
#
# 17:00 UTC ≈ 02:00 JST, well outside the project's primary working hours.
# `workflow_dispatch` lets maintainers re-run on demand without waiting for
# the next scheduled fire.

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10 # >= 10.16 honors web/.npmrc minimum-release-age

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - name: Install protoc
        # protoc is required by the USK-926 grpc_schema source="file"
        # e2e test (internal/mcp/grpc_schema_file_source_integration_test.go).
        # Tests that need protoc gate on exec.LookPath and t.Skip when
        # absent, so this step is a soft requirement: without it, the
        # file-source happy-path tests skip silently.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build UI
        run: make build-ui

      # Go through the Makefile, not a hand-copied `go test` line. The full
      # tier additionally needs GODEBUG=http2xconnect=1 (RFC 8441 extended
      # CONNECT in golang.org/x/net/http2, read at package init) and the
      # Makefile is where that requirement is recorded. This step used to
      # duplicate the command without the GODEBUG, so every WSS-over-h2 e2e
      # test self-skipped on every nightly since 2026-05-09 — and because the
      # full tier runs nowhere else, they were running in no job at all.
      # The `ensure-ui` prerequisite is a no-op here: Build UI ran above.
      - name: Test (e2e full)
        run: make test-e2e
