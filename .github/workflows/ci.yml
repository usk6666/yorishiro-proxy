name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing at the top level: every job declares its own permissions, so a job
# added later starts from zero instead of silently inheriting a grant (ghalint
# job_permissions, enforced by `make lint-workflows`).
permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10 # >= 10.16 honors web/.npmrc minimum-release-age

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build UI
        run: make build-ui

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/
          retention-days: 1

  lint:
    needs: setup
    runs-on: ubuntu-latest
    # Raised from 10: golangci-lint's own `run.timeout` (10m) should be what
    # fires on a pathological run, so the failure says "timeout" instead of the
    # job being killed opaquely.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      # golangci-lint type-checks the whole module, and internal/mcp/webui/embed.go
      # is `//go:embed dist/*`. Without this the lint job fails with
      # "pattern dist/*: no matching files found (typecheck)".
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      # install-only: the action does NOT run the linter -- `make lint` stays the
      # single definition of what linting means (CLAUDE.md). It is not purely an
      # installer, though: at the pinned commit, run() calls restoreCache() and
      # plugins.install() BEFORE the install-only early return, and postRun()
      # calls saveCache() unconditionally. So this step also restores and saves a
      # GitHub Actions cache of $HOME/.cache/golangci-lint (GOLANGCI_LINT_CACHE --
      # analysis results, not the binary).
      #
      # install-mode defaults to `binary`, which downloads the prebuilt release
      # via @actions/tool-cache. Do NOT set `install-mode: goinstall`:
      # golangci-lint v2.13.x declares `go 1.26.0`, and actions/setup-go exports
      # GOTOOLCHAIN=local, so `go install` would fail on this 1.25.x runner in
      # exactly the way the old `go install ...@latest` steps did (USK-1043).
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Lint
        run: make lint

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      # Through the Makefile, not a hand-copied `go test` line (USK-1058): the
      # Makefile is the single source of truth for what a tier means. `make test`
      # is the fast tier -- every untagged test, with `-timeout 4m` kept as the
      # per-package budget sentinel (USK-1048). `ensure-ui` no-ops because the
      # artifact above populated dist/ -- same pattern as the `lint` job.
      - name: Test
        run: make test

  # test-e2e-smoke is the merge-gate tier (USK-728): runs M46 harness scenarios
  # plus a representative connector / layer subset. Full e2e (-tags e2e only)
  # runs nightly via `.github/workflows/nightly-e2e.yml`.
  #
  # It runs ONLY the tests declared in plain `//go:build e2e` files (USK-1209).
  # `-tags 'e2e e2e_smoke'` also compiles every untagged test, so the old
  # `go test ./...` line re-ran the entire fast tier that the `test` job above
  # already runs -- ~4,600 top-level tests twice per PR. The Makefile recipe selects the
  # smoke packages and test names with tools/smokeselect and fails loudly if
  # that selection errors or comes back empty. Through the Makefile for the
  # same USK-1058 reason as `test`.
  test-e2e-smoke:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      - name: Test (e2e smoke)
        run: make test-e2e-smoke

  # Dependency-update PRs exist to prove behavioural compatibility, so the smoke
  # subset is the wrong tier for them: a dependency can only break what its
  # callers exercise, and most of those callers live in the exhaustive tier.
  # USK-1055 — PR #115 (grpc 1.83.1 -> 1.83.2 plus five x/ modules) went green on
  # the smoke tier, merged, and turned 21 `e2e && !e2e_smoke` tests in
  # internal/mcp red on the next nightly, ~8 h later.
  #
  # The condition is the depsec workflow's fixed branch name; that workflow
  # applies no labels, so the branch is its only stable marker. Keep this literal
  # in sync with the `branch=` assignment in
  # .github/workflows/dependabot-security.yml.
  #
  # Job-level `if:` deliberately, NOT a separate workflow with a `branches:`
  # filter: a workflow skipped by path/branch filtering leaves its checks
  # "Pending", which blocks merging if the check is required. A job skipped by a
  # conditional instead "will report its status as 'Success'" and "will not
  # prevent a pull request from merging, even if it is a required check"
  # (GitHub Actions docs, "Using conditions to control job execution"). That is
  # why this job can sit in status-check's `needs:` below: skipped on ordinary
  # PRs, it leaves status-check green; on the depsec PR its failure turns
  # status-check red.
  test-e2e-full:
    needs: setup
    if: github.event_name == 'pull_request' && github.head_ref == 'automated/security-updates'
    runs-on: ubuntu-latest
    # 45, not 15: `make test-e2e` passes `-timeout 30m` to `go test`, and this
    # repo lets the inner timeout fire first so a hang reports "test timed out"
    # with a goroutine dump instead of an opaque job kill (same rationale as the
    # lint job above). Mirrors nightly-e2e.yml.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      # Same soft requirement as nightly-e2e.yml: without protoc the four
      # grpc_schema source="file" tests t.Skip rather than fail, so omitting this
      # step would silently make this job cover less than the nightly does.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Through the Makefile, not a hand-copied `go test` line: the full tier
      # needs GODEBUG=http2xconnect=1 and the Makefile is where that is recorded
      # (USK-1058). `ensure-ui` no-ops because the artifact above populated
      # dist/ — same pattern as the `lint` job.
      - name: Test (e2e full)
        run: make test-e2e

  # web/ had no test gate of any kind before this job. The `test-ui` target has
  # existed in the Makefile since the vitest harness landed (PR #397), but no
  # workflow ever invoked it, so the 17 test files / 335 tests under web/src have
  # never once run in CI.
  #
  # That bites hardest on the weekly dependency PR. dependabot-security.yml
  # updates Go *and* npm, yet on the npm side `test` and `test-e2e-smoke` run only
  # Go tests and `build-ui` proves only that the bundle still compiles. npm bumps
  # were therefore merging with zero behavioural verification -- the npm-side
  # counterpart of the Go-side hole that test-e2e-full closes above (USK-1055).
  #
  # A separate job, deliberately NOT a step appended to `setup`. Five jobs declare
  # `needs: setup`, and GitHub skips a job whose `needs:` target failed, so a
  # single broken 3-second React logic test would fail `setup` and skip lint,
  # build, test and both e2e tiers -- the PR would come back with no Go signal at
  # all. Putting the step after the upload-artifact step does not help: `needs:`
  # keys off the job's conclusion, not on whether the artifact was uploaded.
  #
  # No `needs:` at all, for the same reason depsec-tool has none: `make test-ui`
  # runs pnpm against web/ source and never reads internal/mcp/webui/dist/, so
  # `needs: setup` would serialize it behind a build artifact it does not consume.
  # Independent, it starts at t=0 and adds no wall-clock to the run.
  #
  # Through the Makefile, not a hand-copied `pnpm test`: the Makefile is the single
  # source of truth for what a tier means. Hand-copying the command is exactly what
  # let nightly-e2e.yml lose GODEBUG=http2xconnect=1 and silently SKIP three
  # wss-over-h2 tests for four months (USK-1058).
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10 # >= 10.16 honors web/.npmrc minimum-release-age

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Test (web UI)
        run: make test-ui

  # tools/depsec is a separate Go module (stdlib only, not shipped in the binary)
  # that drives the weekly Dependabot security-update workflow. Gate its
  # supply-chain-critical decision logic on every PR that touches it.
  depsec-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - name: Vet + test depsec
        working-directory: tools/depsec
        run: |
          test -z "$(gofmt -l .)" || (echo "not gofmt-clean:" && gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...

  # Static checks on the workflow files themselves: pinact (every `uses:` is a
  # full commit SHA whose `# vX.Y.Z` comment names that commit), ghalint
  # (permissions, timeouts, persist-credentials, secret / App-token scoping) and
  # actionlint with shellcheck (expressions, contexts, `run:` scripts), plus the
  # status-check `needs:` completeness guard below. Through the Makefile for the
  # USK-1058 reason: the recipe downloads each tool at the version pinned in
  # .workflow-lint-tools and verifies its checksum, so this job and a local
  # `make lint-workflows` run byte-identical binaries.
  #
  # No `needs:` -- it reads only .github/ and must not wait on (or be skipped
  # by) the Go / UI build. `pinact --verify-comment` resolves each tag through
  # the GitHub API, hence the token; read-only is enough.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint workflows
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: make lint-workflows

  # The ONE check the branch ruleset needs from this workflow (besides CodeQL,
  # which is not in ci.yml). Required checks are listed by name, so before this
  # job every new job had to be added to the ruleset by hand, and a job left out
  # (as test-e2e-full was) could fail without blocking the merge.
  #
  # It runs only when something in `needs:` failed or was cancelled, and then
  # fails. Otherwise it is skipped, and a skipped job counts as passing for a
  # required check -- which is also why a job skipped by its own `if:` (e.g.
  # test-e2e-full on an ordinary PR) does not turn this red. `always()` is what
  # makes it run at all once a need has failed; without it GitHub would skip it.
  #
  # RULE: every other job in this file MUST be listed in `needs:`. `setup` is
  # listed too: when it fails its dependents are skipped, not failed, so only
  # its own result carries the failure. `make lint-workflows` enforces the rule
  # (yq compares this list against the `jobs:` keys and names any job missing
  # or extra), so forgetting it fails the PR that adds the job.
  #
  # Keep the job name `status-check` unique across every workflow that runs on
  # pull_request: the ruleset matches checks by name, and a second job with the
  # same name elsewhere would satisfy it on its own.
  status-check:
    runs-on: ubuntu-latest
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 5
    permissions: {}
    needs:
      - setup
      - lint
      - build
      - test
      - test-e2e-smoke
      - test-e2e-full
      - test-ui
      - depsec-tool
      - lint-workflows
    steps:
      - run: exit 1
