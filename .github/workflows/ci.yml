name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10 # >= 10.16 honors web/.npmrc minimum-release-age

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build UI
        run: make build-ui

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/
          retention-days: 1

  lint:
    needs: setup
    runs-on: ubuntu-latest
    # Raised from 10: golangci-lint's own `run.timeout` (10m) should be what
    # fires on a pathological run, so the failure says "timeout" instead of the
    # job being killed opaquely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      # golangci-lint type-checks the whole module, and internal/mcp/webui/embed.go
      # is `//go:embed dist/*`. Without this the lint job fails with
      # "pattern dist/*: no matching files found (typecheck)".
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      # install-only: the action just places the pinned binary on PATH; `make lint`
      # remains the single definition of what linting means (CLAUDE.md).
      #
      # install-mode defaults to `binary`, which downloads the prebuilt release
      # via @actions/tool-cache. Do NOT set `install-mode: goinstall`:
      # golangci-lint v2.13.x declares `go 1.26.0`, and actions/setup-go exports
      # GOTOOLCHAIN=local, so `go install` would fail on this 1.25.x runner in
      # exactly the way the old `go install ...@latest` steps did (USK-1043).
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Lint
        run: make lint

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      - name: Test
        run: go test -race -v -timeout 4m ./...

  # test-e2e-smoke is the merge-gate tier (USK-728): runs M46 harness scenarios
  # plus a representative connector / layer subset. Full e2e (-tags e2e only)
  # runs nightly via `.github/workflows/nightly-e2e.yml`.
  test-e2e-smoke:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/mcp/webui/dist/

      - name: Test (e2e smoke)
        run: go test -race -v -tags 'e2e e2e_smoke' -timeout 10m ./...

  # tools/depsec is a separate Go module (stdlib only, not shipped in the binary)
  # that drives the weekly Dependabot security-update workflow. Gate its
  # supply-chain-critical decision logic on every PR that touches it.
  depsec-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.25.x"

      - name: Vet + test depsec
        working-directory: tools/depsec
        run: |
          test -z "$(gofmt -l .)" || (echo "not gofmt-clean:" && gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...
